<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="q-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <style>
    .quote-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: italic; font-size: 19px; fill: #E2E8F0; font-weight: 400; }
    .author-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94A3B8; }
    .cta-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #FFFFFF; letter-spacing: -0.3px; }
    .cta-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748B; }
  </style>
  <rect width="1200" height="180" fill="url(#q-bg)" rx="8" stroke="#1E293B" stroke-width="1" />
  <rect x="0" y="0" width="1200" height="3" fill="url(#q-accent)" rx="1.5" />
  
  <!-- Left: Quote -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="54" fill="#38BDF8" opacity="0.25">“</text>
    <text x="32" y="8" class="quote-text">Technology is most powerful when it solves real problems for real people.</text>
    <text x="32" y="38" class="author-text">— Daanial Mirza</text>
  </g>

  <!-- Divider -->
  <line x1="730" y1="28" x2="730" y2="152" stroke="#1E293B" stroke-width="1" />

  <!-- Right: Collaboration Call -->
  <g transform="translate(780, 50)">
    <text x="0" y="0" class="cta-heading">Engineering &amp; Research Collaboration</text>
    <text x="0" y="24" class="cta-sub">Available for high-impact AI/ML engineering, research, and systems roles.</text>
    <g transform="translate(0, 44)">
      <rect width="140" height="30" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#38BDF8" text-anchor="middle">Connect on LinkedIn</text>
    </g>
    <g transform="translate(155, 44)">
      <rect width="140" height="30" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#E2E8F0" text-anchor="middle">Explore Codebases</text>
    </g>
  </g>
</svg>
