<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="q-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="q-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <style>
    .quote-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-style: italic; font-size: 20px; fill: #E2E8F0; }
    .author-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #94A3B8; }
    .cta-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #FFFFFF; }
    .cta-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748B; }
  </style>
  <rect width="1200" height="220" fill="url(#q-bg)" rx="14" stroke="#1E293B" stroke-width="1" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#q-accent)" rx="2" />
  
  <!-- Left: Quote -->
  <g transform="translate(60, 55)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="60" fill="#38BDF8" opacity="0.3">“</text>
    <text x="35" y="10" class="quote-text">Technology is most powerful when it solves real problems for real people.</text>
    <text x="35" y="45" class="author-text">— Daanial Mirza</text>
  </g>

  <!-- Divider -->
  <line x1="720" y1="35" x2="720" y2="185" stroke="#1E293B" stroke-width="1" />

  <!-- Right: Collaboration Call -->
  <g transform="translate(770, 65)">
    <text x="0" y="0" class="cta-heading">Let's build something remarkable together</text>
    <text x="0" y="26" class="cta-sub">Open to high-impact AI/ML engineering, research, and systems collaborations.</text>
    <g transform="translate(0, 50)">
      <rect width="130" height="34" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
      <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#38BDF8" text-anchor="middle">💼 Let's Connect</text>
    </g>
    <g transform="translate(145, 50)">
      <rect width="130" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">⭐ Explore Repos</text>
    </g>
  </g>
</svg>
