<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Dark Slate Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="mount-back" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="mount-front" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#080B11" />
    </linearGradient>

    <linearGradient id="glow-ambient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <style>
    .greeting { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #94A3B8; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 48px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1px; }
    .hero-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #94A3B8; letter-spacing: 2px; }
    .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 400; fill: #CBD5E1; line-height: 1.6; }
    .handwriting { font-family: 'Segoe Script', 'Caveat', cursive, sans-serif; font-size: 24px; fill: #38BDF8; font-style: italic; }
    .mission-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 2.5px; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .btn-text-secondary { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg)" rx="12" />

  <!-- Subtle Radial Light -->
  <circle cx="150" cy="100" r="200" fill="url(#glow-ambient)" filter="url(#blur)" />
  <circle cx="1050" cy="80" r="220" fill="url(#glow-ambient)" filter="url(#blur)" />

  <!-- Star Points -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="220" cy="45" r="1" />
    <circle cx="340" cy="70" r="1.5" />
    <circle cx="510" cy="35" r="1" />
    <circle cx="680" cy="65" r="1.5" />
    <circle cx="820" cy="40" r="1" />
    <circle cx="950" cy="80" r="1.5" />
    <circle cx="1120" cy="45" r="1" />
  </g>

  <!-- Distant Mountain Terrain -->
  <path d="M 0 380 L 0 270 L 150 210 L 290 250 L 460 180 L 620 230 L 790 150 L 930 210 L 1070 130 L 1200 190 L 1200 380 Z" fill="url(#mount-back)" />

  <!-- Midground Mountain Silhouette -->
  <path d="M 0 380 L 0 300 L 180 240 L 330 280 L 510 210 L 680 260 L 850 180 L 980 230 L 1120 160 L 1200 210 L 1200 380 Z" fill="url(#mount-front)" />

  <!-- Subtle Ridge Highlight Vector -->
  <path d="M 460 180 L 620 230 L 790 150 L 930 210 L 1070 130" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.25" />

  <!-- Top Right Inscription Artwork -->
  <g transform="translate(940, 50)">
    <text x="0" y="0" class="handwriting" text-anchor="middle" transform="rotate(-6)">Ideas</text>
    <text x="26" y="26" class="handwriting" text-anchor="middle" transform="rotate(-6)" fill="#60A5FA">Code</text>
    <text x="52" y="52" class="handwriting" text-anchor="middle" transform="rotate(-6)" fill="#93C5FD">Impact</text>
    <path d="M -35 15 Q 5 45 80 70" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.4" />
  </g>

  <!-- Top Right Corporate / Mission Note -->
  <g transform="translate(1000, 140)">
    <text x="0" y="0" class="mission-sub">BETTER TECHNOLOGY</text>
    <text x="0" y="15" class="mission-sub">A BRIGHTER TOMORROW</text>
    <line x1="0" y1="24" x2="35" y2="24" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Left Content Body -->
  <g transform="translate(60, 55)">
    <!-- Greeting -->
    <text x="0" y="0" class="greeting">Hi there</text>

    <!-- Main Title -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" class="hero-name">I'm <tspan fill="url(#text-gradient)">Daanial Mirza</tspan></text>
    </g>

    <!-- Professional Role Strip -->
    <g transform="translate(0, 82)">
      <text x="0" y="0" class="hero-role">AI/ML ENGINEER &nbsp;•&nbsp; SYSTEMS BUILDER &nbsp;•&nbsp; RESEARCHER</text>
    </g>

    <!-- Concise Professional Bio Description -->
    <g transform="translate(0, 118)">
      <text x="0" y="0" class="hero-desc">I design and engineer deterministic AI architectures, evidence-grounded graph engines,</text>
      <text x="0" y="24" class="hero-desc">physics-informed digital twins, and autonomous computer vision systems.</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 185)">
      <!-- Primary Button -->
      <g transform="translate(0, 0)">
        <rect width="145" height="38" rx="6" fill="#0284C7" />
        <!-- Code Icon SVG -->
        <path d="M 22 19 L 16 14 L 22 9 M 28 9 L 34 14 L 28 19" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="24" class="btn-text">View Systems</text>
      </g>

      <!-- Secondary Button -->
      <g transform="translate(160, 0)">
        <rect width="145" height="38" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <!-- Mail / Connect Icon SVG -->
        <path d="M 18 13 L 26 19 L 34 13 M 17 11 H 35 V 25 H 17 Z" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" />
        <text x="44" y="24" class="btn-text-secondary">Let's Connect</text>
      </g>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="379" rx="11.5" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
