<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="40%" stop-color="#0B0F19" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>

    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="mount-back" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="mount-front" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #FFFFFF; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38BDF8; letter-spacing: 1.5px; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #CBD5E1; }
    .handwriting { font-family: 'Segoe Script', 'Brush Script MT', 'Caveat', cursive, sans-serif; font-size: 26px; fill: #38BDF8; opacity: 0.85; font-style: italic; }
    .quote-box { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #64748B; letter-spacing: 2px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
  <circle cx="1000" cy="120" r="220" fill="url(#glow-purple)" filter="url(#blur-glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Star Constellations / Micro Tech Dots -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="150" cy="60" r="1" opacity="0.4" />
    <circle cx="280" cy="40" r="1.5" opacity="0.7" />
    <circle cx="340" cy="90" r="1" opacity="0.3" />
    <circle cx="480" cy="50" r="1.5" opacity="0.8" />
    <circle cx="620" cy="70" r="1" opacity="0.5" />
    <circle cx="750" cy="35" r="2" opacity="0.9" />
    <circle cx="820" cy="80" r="1" opacity="0.4" />
    <circle cx="920" cy="45" r="1.5" opacity="0.7" />
    <circle cx="1040" cy="75" r="2" opacity="0.8" />
    <circle cx="1120" cy="40" r="1" opacity="0.5" />
    <circle cx="70" cy="120" r="1.5" opacity="0.6" />
    <circle cx="1140" cy="130" r="1.5" opacity="0.6" />
  </g>

  <!-- Constellation Connection Lines -->
  <g stroke="#38BDF8" stroke-width="0.75" opacity="0.2">
    <line x1="750" y1="35" x2="820" y2="80" />
    <line x1="820" y1="80" x2="920" y2="45" />
    <line x1="920" y1="45" x2="1040" y2="75" />
  </g>

  <!-- Background Mountain Silhouette Layer -->
  <path d="M 0 400 L 0 280 L 120 230 L 250 270 L 380 200 L 520 260 L 680 170 L 820 230 L 980 140 L 1100 210 L 1200 160 L 1200 400 Z" fill="url(#mount-back)" />

  <!-- Foreground Mountain Silhouette Layer -->
  <path d="M 0 400 L 0 320 L 140 270 L 290 310 L 440 240 L 610 300 L 780 210 L 910 260 L 1050 190 L 1200 240 L 1200 400 Z" fill="url(#mount-front)" />

  <!-- Subtle Cyber Terrain Vector Ridge Lines -->
  <path d="M 680 170 L 780 210 L 910 260 L 1050 190 L 1200 240" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.3" />
  <path d="M 980 140 L 1050 190" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.4" />

  <!-- Top Right Inscription (Inspired by Reference Image) -->
  <g transform="translate(940, 55)">
    <text x="0" y="0" class="handwriting" text-anchor="middle" transform="rotate(-7)">Ideas</text>
    <text x="25" y="28" class="handwriting" text-anchor="middle" transform="rotate(-7)" fill="#818CF8">Code</text>
    <text x="50" y="56" class="handwriting" text-anchor="middle" transform="rotate(-7)" fill="#C084FC">Impact</text>
    <!-- Arrow sketch -->
    <path d="M -40 10 Q 0 40 85 70" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- Top Right Mission Statement Badge -->
  <g transform="translate(990, 150)">
    <text x="0" y="0" class="quote-box" text-anchor="start">BETTER TECHNOLOGY</text>
    <text x="0" y="16" class="quote-box" text-anchor="start">A BRIGHTER TOMORROW</text>
    <line x1="0" y1="26" x2="40" y2="26" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 65)">
    
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18.5" class="badge-text">AI / ML &amp; SOFTWARE ENGINEER</text>
    </g>

    <!-- Main Name Heading -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" class="title">
        Hi, I'm <tspan fill="url(#cyan-purple)">Daanial Mirza</tspan>
      </text>
    </g>

    <!-- Subtitle / Role -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" class="subtitle" font-weight="600" fill="#E2E8F0">
        Engineer &amp; Builder <tspan fill="#64748B">•</tspan> Computer Vision &amp; Robotics <tspan fill="#64748B">•</tspan> Full-Stack Systems
      </text>
      <text x="0" y="28" class="subtitle">
        Building deterministic intelligence, graph reasoning engines, and autonomous systems.
      </text>
    </g>

    <!-- Tech Domain Badges -->
    <g transform="translate(0, 185)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" class="tag">🤖 AI / Multi-Agent</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(145, 0)">
        <rect width="150" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" class="tag">👁️ Computer Vision</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(305, 0)">
        <rect width="170" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" class="tag">🚁 Robotics &amp; Autonomy</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(485, 0)">
        <rect width="180" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="19" class="tag">🌐 Distributed Systems</text>
      </g>
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="398" x2="1160" y2="398" stroke="url(#line-glow)" stroke-width="2" />

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
