<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="mount-back" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="mount-front" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <linearGradient id="glow-ambient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif; font-size: 13px; font-weight: 600; fill: #38BDF8; letter-spacing: 2px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif; font-size: 44px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.8px; }
    .hero-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif; font-size: 14px; font-weight: 600; fill: #94A3B8; letter-spacing: 2px; }
    .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif; font-size: 15px; font-weight: 400; fill: #CBD5E1; }
    .handwriting { font-family: 'Segoe Script', 'Caveat', cursive, sans-serif; font-size: 22px; fill: #38BDF8; font-style: italic; }
    .mission-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 2px; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; }
    .btn-text-secondary { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg)" rx="10" />

  <!-- Subtle Radial Glow -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-ambient)" filter="url(#blur)" />
  <circle cx="1050" cy="80" r="200" fill="url(#glow-ambient)" filter="url(#blur)" />

  <!-- Subtle Grid Overlay -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Distant Mountain Terrain Layer -->
  <path d="M 0 360 L 0 260 L 160 200 L 310 240 L 490 170 L 650 220 L 810 140 L 950 200 L 1090 120 L 1200 180 L 1200 360 Z" fill="url(#mount-back)" />

  <!-- Midground Mountain Silhouette -->
  <path d="M 0 360 L 0 290 L 190 230 L 350 270 L 530 200 L 710 250 L 880 170 L 1010 220 L 1140 150 L 1200 195 L 1200 360 Z" fill="url(#mount-front)" />

  <!-- Vector Ridge Accent -->
  <path d="M 490 170 L 650 220 L 810 140 L 950 200 L 1090 120" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.25" />

  <!-- Top Right Inscription Artwork -->
  <g transform="translate(940, 50)">
    <text x="0" y="0" class="handwriting" text-anchor="middle" transform="rotate(-6)">Ideas</text>
    <text x="24" y="24" class="handwriting" text-anchor="middle" transform="rotate(-6)" fill="#818CF8">Code</text>
    <text x="48" y="48" class="handwriting" text-anchor="middle" transform="rotate(-6)" fill="#C084FC">Impact</text>
    <path d="M -30 15 Q 5 40 75 65" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.4" />
  </g>

  <!-- Top Right Engineering Motto -->
  <g transform="translate(1000, 135)">
    <text x="0" y="0" class="mission-sub">SYSTEMS ARCHITECTURE</text>
    <text x="0" y="15" class="mission-sub">DETERMINISTIC INTELLIGENCE</text>
    <line x1="0" y1="24" x2="35" y2="24" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Left Content Body -->
  <g transform="translate(60, 50)">
    <!-- Sub-badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="24" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8" />
      <text x="24" y="16" class="label">AI / ML &amp; SYSTEMS ENGINEER</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="hero-name">Daanial Mirza</text>
    </g>

    <!-- Professional Role Strip -->
    <g transform="translate(0, 88)">
      <text x="0" y="0" class="hero-role">GRAPH INTELLIGENCE &nbsp;•&nbsp; AUTONOMOUS SYSTEMS &nbsp;•&nbsp; DISTRIBUTED PLATFORMS</text>
    </g>

    <!-- Bio Description -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" class="hero-desc">Engineering mathematically grounded AI systems, graph-native reasoning engines,</text>
      <text x="0" y="24" class="hero-desc">physics-informed digital twins, and autonomous edge perception pipelines.</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 185)">
      <!-- Primary Button -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="5" fill="#0284C7" />
        <text x="70" y="22" class="btn-text" text-anchor="middle">View Systems Matrix</text>
      </g>

      <!-- Secondary Button -->
      <g transform="translate(155, 0)">
        <rect width="140" height="34" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="70" y="22" class="btn-text-secondary" text-anchor="middle">Review Codebases</text>
      </g>
    </g>
  </g>

  <!-- Outer Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
