<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="hud-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <style>
    .hud-val { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #FFFFFF; }
    .hud-lbl { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #38BDF8; letter-spacing: 1.5px; }
    .hud-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
  </style>

  <rect width="1200" height="100" fill="url(#hud-bg)" rx="10" stroke="#1E293B" stroke-width="1" />
  <rect x="0" y="0" width="1200" height="2" fill="url(#hud-cyan)" rx="1" />

  <!-- Item 1: Repositories -->
  <g transform="translate(45, 24)">
    <rect width="32" height="32" rx="6" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1" />
    <path d="M 10 9 C 10 7.5 11.5 6 13 6 H 22 V 24 H 13 C 11.5 24 10 22.5 10 21 Z M 10 21 C 10 22.5 11.5 24 13 24 H 22" fill="none" stroke="#00F0FF" stroke-width="1.8" />
    <g transform="translate(44, 4)">
      <text x="0" y="0" class="hud-lbl">CODEBASES</text>
      <text x="0" y="20" class="hud-val">22 Public Repos</text>
      <text x="0" y="36" class="hud-sub">Audited &amp; Maintained</text>
    </g>
  </g>

  <line x1="265" y1="20" x2="265" y2="80" stroke="#1E293B" stroke-width="1" />

  <!-- Item 2: Stars & Impact -->
  <g transform="translate(295, 24)">
    <rect width="32" height="32" rx="6" fill="#60A5FA" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1" />
    <path d="M 16 7 L 18.5 12.5 L 24.5 13.5 L 20 18 L 21 24 L 16 21 L 11 24 L 12 18 L 7.5 13.5 L 13.5 12.5 Z" fill="none" stroke="#60A5FA" stroke-width="1.6" stroke-linejoin="round" />
    <g transform="translate(44, 4)">
      <text x="0" y="0" class="hud-lbl" fill="#60A5FA">IMPACT</text>
      <text x="0" y="20" class="hud-val">17+ Stars</text>
      <text x="0" y="36" class="hud-sub">Open-Source Verified</text>
    </g>
  </g>

  <line x1="495" y1="20" x2="495" y2="80" stroke="#1E293B" stroke-width="1" />

  <!-- Item 3: Flagship Systems -->
  <g transform="translate(525, 24)">
    <rect width="32" height="32" rx="6" fill="#818CF8" fill-opacity="0.1" stroke="#818CF8" stroke-width="1" />
    <path d="M 16 7 L 25 11.5 L 16 16 L 7 11.5 Z M 7 17 L 16 21.5 L 25 17 M 7 21.5 L 16 26 L 25 21.5" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(44, 4)">
      <text x="0" y="0" class="hud-lbl" fill="#818CF8">SYSTEMS</text>
      <text x="0" y="20" class="hud-val">8 Flagships</text>
      <text x="0" y="36" class="hud-sub">End-to-End Architectures</text>
    </g>
  </g>

  <line x1="735" y1="20" x2="735" y2="80" stroke="#1E293B" stroke-width="1" />

  <!-- Item 4: Hackathons & Competitions -->
  <g transform="translate(765, 24)">
    <rect width="32" height="32" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" />
    <path d="M 10 9 H 22 V 16 C 22 19.5 19 22 16 22 C 13 22 10 19.5 10 16 Z M 22 11 H 25 C 25 13.5 23.5 15 22 15 M 10 11 H 7 C 7 13.5 8.5 15 10 15 M 13 23 H 19 V 26 H 13 Z" fill="none" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(44, 4)">
      <text x="0" y="0" class="hud-lbl" fill="#10B981">HONORS</text>
      <text x="0" y="20" class="hud-val">1st Place</text>
      <text x="0" y="36" class="hud-sub">RocketRide 2026 Winner</text>
    </g>
  </g>

  <line x1="975" y1="20" x2="975" y2="80" stroke="#1E293B" stroke-width="1" />

  <!-- Item 5: Space Robotics -->
  <g transform="translate(1005, 24)">
    <rect width="32" height="32" rx="6" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1" />
    <circle cx="16" cy="16" r="9" fill="none" stroke="#F59E0B" stroke-width="1.6" />
    <circle cx="16" cy="16" r="3" fill="#F59E0B" />
    <g transform="translate(44, 4)">
      <text x="0" y="0" class="hud-lbl" fill="#F59E0B">ROBOTICS</text>
      <text x="0" y="20" class="hud-val">ISRO ISRC</text>
      <text x="0" y="36" class="hud-sub">Elimination Qualifier</text>
    </g>
  </g>
</svg>
