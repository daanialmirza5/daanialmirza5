<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 88" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.5px; }
  </style>

  <!-- Outer Frame -->
  <rect width="1200" height="88" fill="url(#card-bg)" rx="8" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 1: Repositories -->
  <g transform="translate(50, 24)">
    <path d="M 0 3 C 0 1.3 1.3 0 3 0 H 18 V 18 H 3 C 1.3 18 0 16.7 0 15 Z M 0 15 C 0 16.7 1.3 18 3 18 H 18" fill="none" stroke="#38BDF8" stroke-width="1.8" />
    <g transform="translate(30, 6)">
      <text x="0" y="0" class="val">22</text>
      <text x="0" y="16" class="lbl">PUBLIC REPOSITORIES</text>
    </g>
  </g>

  <line x1="260" y1="18" x2="260" y2="70" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 2: Verified Stars -->
  <g transform="translate(295, 24)">
    <path d="M 9 0 L 11.8 5.8 L 18 6.7 L 13.5 11.1 L 14.6 17.2 L 9 14.3 L 3.4 17.2 L 4.5 11.1 L 0 6.7 L 6.2 5.8 Z" fill="none" stroke="#60A5FA" stroke-width="1.6" stroke-linejoin="round" />
    <g transform="translate(30, 6)">
      <text x="0" y="0" class="val">17+</text>
      <text x="0" y="16" class="lbl">COMMUNITY STARS</text>
    </g>
  </g>

  <line x1="495" y1="18" x2="495" y2="70" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 3: Flagship Systems -->
  <g transform="translate(530, 24)">
    <path d="M 9 0 L 18 4.5 L 9 9 L 0 4.5 Z M 0 10 L 9 14.5 L 18 10 M 0 14.5 L 9 19 L 18 14.5" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(30, 6)">
      <text x="0" y="0" class="val">8</text>
      <text x="0" y="16" class="lbl">FLAGSHIP SYSTEMS</text>
    </g>
  </g>

  <line x1="735" y1="18" x2="735" y2="70" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 4: Hackathons & Competitions -->
  <g transform="translate(770, 24)">
    <path d="M 3 2 H 15 V 9 C 15 12 12 14.5 9 14.5 C 6 14.5 3 12 3 9 Z M 15 4 H 18 C 18 6.5 16.5 8 15 8 M 3 4 H 0 C 0 6.5 1.5 8 3 8 M 6 16 H 12 V 19 H 6 Z" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(30, 6)">
      <text x="0" y="0" class="val">1st Place &amp; Finalist</text>
      <text x="0" y="16" class="lbl">COMPETITIVE MILESTONES</text>
    </g>
  </g>

  <line x1="995" y1="18" x2="995" y2="70" stroke="#1E293B" stroke-width="1" />

  <!-- Metric 5: Architecture Status -->
  <g transform="translate(1025, 24)">
    <circle cx="9" cy="9" r="8" fill="none" stroke="#38BDF8" stroke-width="1.6" />
    <circle cx="9" cy="9" r="2.5" fill="#38BDF8" />
    <g transform="translate(28, 6)">
      <text x="0" y="0" class="val">Deterministic</text>
      <text x="0" y="16" class="lbl">SYSTEM INVARIANTS</text>
    </g>
  </g>
</svg>
